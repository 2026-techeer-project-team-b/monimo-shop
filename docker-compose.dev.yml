# 쇼핑몰 로컬 실행: MySQL + 결제 + 주문 (Phase 1a). gateway · inventory 는 1b 에 추가한다.
#
#   docker network create monimo-dev                              # 처음 한 번만 (backend 와 같이 쓰는 공용 네트워크)
#   docker compose -f docker-compose.dev.yml up -d --build --wait  # 켜기 (셋 다 healthy 가 될 때까지 기다림)
#   docker compose -f docker-compose.dev.yml down                  # 끄기 (주문 데이터는 볼륨에 남음, 지우려면 down -v)
#
# 값은 .env 로 바꾼다 (.env.example 참고). 비워 두면 아래 ${이름:-기본값} 의 기본값을 쓴다.
# 에이전트는 이미지에 들어 있어 collector:4317 로 보낸다. 수집기는 monimo-backend 에서 --profile collector 로 켠다.
# 수집기가 꺼져 있어도 쇼핑몰은 정상으로 뜬다 (에이전트는 전송 실패를 로그로만 남긴다).
name: monimo-shop

# 공용 네트워크 monimo-dev (개발환경 6단계 연결 약속). backend compose 가 같은 이름으로 쓴다.
networks:
  default:
    name: monimo-dev
    external: true

services:
  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop}
      MYSQL_USER: ${MYSQL_USER:-shop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shop}
      # 로컬 전용. 운영 비밀값이 아니다
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - shop-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  payment:
    build:
      context: .
      dockerfile: payment/Dockerfile
    image: monimo/shop-payment:dev
    ports:
      - "${PAYMENT_PORT:-8092}:8092"
    environment:
      # 기본은 agent.properties 의 collector:4317. .env 로 덮어쓸 때만 바뀐다
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4317}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8092/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      # 에이전트가 계측 코드를 심느라 기동이 몇 초 느려진다
      start_period: 30s

  order:
    build:
      context: .
      dockerfile: order/Dockerfile
    image: monimo/shop-order:dev
    ports:
      - "${ORDER_PORT:-8091}:8091"
    environment:
      # MYSQL_HOST=mysql · PAYMENT_BASE_URL=http://payment:8092 는 이미지 기본값이라 적지 않는다 (서비스 이름과 같다)
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop}
      MYSQL_USER: ${MYSQL_USER:-shop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shop}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://collector:4317}
    depends_on:
      # 주문은 뜰 때 schema.sql 을 실행하고, 실패하면 기동을 멈춘다(continue-on-error=false). 그래서 MySQL 이 준비된 뒤에 띄운다
      mysql:
        condition: service_healthy
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8091/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  shop-mysql-data:
