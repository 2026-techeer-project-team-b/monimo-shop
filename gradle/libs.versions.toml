# 라이브러리 버전은 이 파일 한 곳에서만 정한다. 모듈의 build.gradle.kts 에는 버전을 쓰지 않는다.
# 버전은 monimo-backend/gradle/libs.versions.toml 과 맞춘다 (두 레포를 같은 사람이 오가므로 규칙을 하나로).

[versions]
java = "17"
kotlin = "2.2.21"
spring-boot = "3.5.16"
kotest = "6.2.5"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
# 테스트는 Kotest (ADR #48). JUnit Platform 위에서 돈다.
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
# 쇼핑몰 서비스 4개가 공통으로 쓰는 것. 동기 Spring MVC 만 쓴다 (WebFlux 는 MVP 범위 밖, ADR #33).
service-base = ["spring-boot-starter-web", "spring-boot-starter-actuator", "jackson-module-kotlin", "kotlin-reflect"]
service-test = ["spring-boot-starter-test", "kotest-runner-junit5", "kotest-assertions-core", "kotest-extensions-spring"]
# 스프링이 없는 모듈(agent-extension)용
kotest = ["kotest-runner-junit5", "kotest-assertions-core"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
