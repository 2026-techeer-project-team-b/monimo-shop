server:
  port: 8091

spring:
  application:
    name: shop-order
  datasource:
    # 로컬에서 직접 띄울 때 기본값. 컨테이너에서는 compose 가 MYSQL_HOST=mysql 로 덮어쓴다 (4단계)
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:shop}
    username: ${MYSQL_USER:shop}
    password: ${MYSQL_PASSWORD:shop}
  sql:
    init:
      # 앱이 뜰 때 schema.sql 을 실행해 orders 표를 만든다. 감시 대상 더미라 Flyway 는 안 쓴다
      mode: always
      # SQL 이 실패하면 앱을 띄우지 않는다. 조용히 떠 있다가 INSERT 때 "표가 없다"로 터지는 것보다 원인이 바로 보인다
      continue-on-error: false

# 결제 서비스 주소. 컨테이너끼리는 http://payment:8092 (4단계 compose 에서 덮어씀)
payment:
  base-url: ${PAYMENT_BASE_URL:http://localhost:8092}
